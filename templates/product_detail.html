{% extends "base.html" %}
{% block title %}{{ product.name }} - QuickStock{% endblock %}

{% block content %}
<a href="{{ url_for('products') }}" class="btn btn-link ps-0 mb-3 text-decoration-none">&larr; Back to Products</a>

<div class="card shadow-sm border-0" style="max-width: 480px;">
    <div class="card-body">
        <div class="text-muted small text-uppercase mb-1">Product Details</div>
        <h4 class="card-title mb-4">{{ product.name }}</h4>

        <table class="table table-borderless mb-0">
            <tbody>
                <tr>
                    <th class="text-muted" style="width: 40%;">Price</th>
                    <td>&#8377;{{ "{:,.2f}".format(product.price) }}</td>
                </tr>
                <tr>
                    <th class="text-muted">Stock</th>
                    <td>
                        <span class="badge bg-{{ 'success' if product.stock > 15 else 'warning' }}">
                            {{ product.stock }} units
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}" class="mt-3 mb-0">
            <button type="submit" class="btn btn-primary w-100">Add to Cart</button>
        </form>
    </div>
</div>
{% endblock %}
