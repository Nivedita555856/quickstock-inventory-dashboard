{% extends "base.html" %}
{% block title %}Products - QuickStock{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Product List</h2>
    <a href="{{ url_for('add_product') }}" class="btn btn-primary">+ Add Product</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>
                        <a href="{{ url_for('product_detail', product_id=product.id) }}" class="text-decoration-none fw-semibold">
                            {{ product.name }}
                        </a>
                    </td>
                    <td>&#8377;{{ "{:,.2f}".format(product.price) }}</td>
                    <td>{{ product.stock }}</td>
                    <td>
                        <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}" class="mb-0">
                            <button type="submit" class="btn btn-sm btn-primary">Add to Cart</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
